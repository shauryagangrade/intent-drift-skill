name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    # Skip pre-release tags (e.g. v1.0.0-rc.1) so they can be tested first.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-skill-intent-drift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      # Prerequisite: add a trusted publisher for this repo on PyPI
      # (https://docs.pypi.org/trusted-publishers/) before the first tag.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
