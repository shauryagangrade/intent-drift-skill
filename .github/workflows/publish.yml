# npm-only by design. PyPI publication of intent-drift-skill was removed in
# 4aad237: trusted-publisher OIDC was never configured on the PyPI project, so
# every release-tag publish failed at the token exchange. The engine ships via
# `npx intent-drift`, which installs it from PyPI on first run; this repo's own
# dist intentionally stays off PyPI so it cannot shadow the engine's name.
name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # This package has no dependencies to install (it's a pure `bin` wrapper
      # that bootstraps Python at runtime), so publish straight from the
      # checkout. npm ci would require a package-lock.json that doesn't exist.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
