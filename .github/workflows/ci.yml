name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install intent-drift PyYAML pytest pytest-cov

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=35

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  lint:
    name: Lint, format & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy intent-drift

      - name: Ruff lint
        run: ruff check .

      - name: Black format check
        run: black --check .

      - name: Mypy type check
        run: mypy

  validate:
    name: Validate skill metadata & repo consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate metadata.json and required files
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          # metadata.json must be valid JSON with the keys the harness depends on
          meta = json.loads(Path("metadata.json").read_text())
          required = {"name", "version", "description", "parameters", "dependencies"}
          missing = required - set(meta)
          if missing:
              sys.exit(f"metadata.json is missing required keys: {sorted(missing)}")

          # version must match pyproject.toml
          try:
              import tomllib
          except ImportError:  # Python < 3.11
              tomllib = None
          if tomllib:
              pyproject = tomllib.loads(Path("pyproject.toml").read_text())
              declared = pyproject["project"]["version"]
          else:
              # Python 3.10 CI matrix: parse the version line without tomllib
              match = re.search(r'^version = "([^"]+)"',
                                Path("pyproject.toml").read_text(), re.M)
              declared = match.group(1) if match else "?"
          if declared != meta["version"]:
              sys.exit(
                  f"version mismatch: pyproject.toml={declared} "
                  f"metadata.json={meta['version']}"
              )

          # canonical skill name is pinned: "intent-drift"
          # (pyproject's dist name is intentionally different — see pyproject.toml)
          if meta["name"] != "intent-drift":
              sys.exit(f"metadata.json name must be 'intent-drift', got {meta['name']!r}")

          if tomllib:
              dist = pyproject["project"]["name"].lower().replace("_", "-")
              deps = [
                  re.split(r"[<>=!~\[]", d.strip(), maxsplit=1)[0]
                  .lower().replace("_", "-")
                  for d in pyproject["project"].get("dependencies", [])
              ]
              if dist in deps:
                  sys.exit(
                      f"self-dependency collision: dist '{dist}' also listed in "
                      f"dependencies; pip would resolve its own engine package"
                  )

          # packaging must reference the published engine, not a local path
          for f in ["pyproject.toml", "analyzer.py", "__init__.py"]:
              if "Projects" in Path(f).read_text() or "Path.home" in Path(f).read_text():
                  sys.exit(f"{f} must not reference machine-local engine paths")

          # the skill's runtime files must exist
          for f in ["analyzer.py", "SKILL.md", "README.md", "LICENSE", "install.sh"]:
              if not Path(f).is_file():
                  sys.exit(f"required file missing: {f}")

          print("metadata + repo consistency OK")
          PY

  install-smoke:
    name: install.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install engine dependency
        run: python -m pip install intent-drift PyYAML

      - name: Run install.sh and verify symlink
        run: |
          bash ./install.sh
          test -L "$HOME/.claude/skills/intent-drift"
          test "$(readlink -f "$HOME/.claude/skills/intent-drift")" = "$(readlink -f "$PWD")"

      - name: Smoke test the installed skill
        run: |
          PYTHONPATH="$HOME/.claude/skills/intent-drift" python - <<'PY'
          from analyzer import IntentDriftAnalyzer

          analyzer = IntentDriftAnalyzer()
          cfg = analyzer.parse_arguments(
              ["--original-goal", "reduce memory usage",
               "--current-plan", "optimize startup", "--format", "json"]
          )
          assert cfg["format"] == "json"
          report = analyzer.analyze(cfg)
          assert report.overall_alignment >= 0
          print("installed skill smoke test OK")
          PY

      - name: Shellcheck install.sh (best-effort)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          else
            echo "shellcheck not available; skipping"
          fi

  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Install wheel in a clean venv and smoke test the CLI
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/intent-drift \
            --original-goal "reduce memory usage" \
            --current-plan "optimize startup initialization" \
            --format json > /tmp/report.json 2>&1
          python - <<'PY'
          import json
          report = json.load(open("/tmp/report.json"))
          assert "overall_alignment" in report
          assert "status" in report
          print("wheel CLI smoke test OK")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
